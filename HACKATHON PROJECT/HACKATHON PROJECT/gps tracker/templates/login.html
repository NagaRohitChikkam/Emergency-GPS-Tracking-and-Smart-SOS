{% extends "base.html" %}
{% block title %}Login — GPS Emergency Tracker{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px;box-shadow:0 0 30px rgba(99,102,241,0.4)">🛰️</div>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your GPS Tracker account</p>

    <form method="POST" action="{{ url_for('login') }}" id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;cursor:pointer">
          <input type="checkbox" name="remember" style="accent-color:var(--accent)">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="login-btn">
        Sign In →
      </button>
    </form>

    <div class="auth-divider">— or —</div>

    <p style="text-align:center;font-size:.875rem;color:var(--text-secondary)">
      Don't have an account?
      <a href="{{ url_for('register') }}" style="color:var(--accent);font-weight:600">Create one free</a>
    </p>

    <hr class="divider">
    <div style="background:rgba(99,102,241,0.08);border:1px solid var(--border-glow);border-radius:var(--radius-md);padding:12px 16px;font-size:.8rem;color:var(--text-secondary)">
      <strong style="color:var(--text-primary)">🔑 Demo Admin:</strong><br>
      Email: <code style="color:var(--accent)">admin@gpstracker.com</code><br>
      Password: <code style="color:var(--accent)">admin123</code>
    </div>
  </div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", function() {
  const btn = document.getElementById("login-btn");
  btn.innerHTML = '<span class="loader"></span> Signing in…';
  btn.disabled = true;
});
</script>
{% endblock %}
